# Builds the macOS versions on GitHub Macs and attaches them to the release.
# Apple Silicon and Intel need different AI engine binaries, so each is built on its own Mac.
# Runs automatically when a release is published, or by hand for an existing tag.
name: Version Mac

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release (ex. v1.4.0)"
        required: true

permissions:
  contents: write

jobs:
  mac:
    strategy:
      matrix:
        include:
          - runner: macos-14 # Apple Silicon (M1…M4)
            arch: arm64
          - runner: macos-13 # Intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Construire l'application Mac
        run: npm run build && npx electron-builder --mac --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Joindre les fichiers à la release
        run: gh release upload "$TAG" release/NotesPlusPlus-Mac-${{ matrix.arch }}.dmg release/NotesPlusPlus-Mac-${{ matrix.arch }}.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
